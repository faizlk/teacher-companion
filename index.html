<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>LessonLog</title>

  <link rel="manifest" href="./manifest.json">
  
  <!-- Tailwind & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Identity & Drive API -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
</head>
<body class="bg-slate-50 font-sans text-gray-900 pb-20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ══════════════════════════════════════════
    //  CONFIGURATION – PUT YOUR OWN CLIENT ID  
    // ══════════════════════════════════════════
    const GOOGLE_CLIENT_ID = "898137665800-q1bht1nmh4mkluki2230bjegp6hv72ou.apps.googleusercontent.com"; // <-- replace
    const SCOPES = "https://www.googleapis.com/auth/drive.file";
    const DATA_FILENAME = "lessonlog_data.json";

    // --- HELPERS ---
    const formatTime = (date) => date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const formatDate = (date) => date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
    const getDayString = (date) => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][date.getDay()];

    const getTotalPages = (data, subject) => {
      const log = data.lessons[subject];
      if (!log) return 100;
      if (log.books && log.books.length) return log.books.reduce((acc, b) => acc + Math.max(0, b.to - b.from + 1), 0);
      return log.totalPages || 100; 
    };

    const getWeekNumber = (date, termStart, firstWeekType) => {
      if (!termStart) {
        const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const startOfYear = new Date(d.getFullYear(), 0, 1);
        const pastDays = (d - startOfYear) / 86400000;
        const startDay = (startOfYear.getDay() + 1) % 7;
        return Math.ceil((pastDays + startDay + 1) / 7);
      }
      const start = new Date(termStart + 'T00:00:00');
      const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const dayDiff = Math.floor((target - start) / 86400000);
      if (dayDiff < 0) return 1;
      const weekNumber = Math.ceil((dayDiff + 1) / 7);
      return weekNumber || 1;
    };

    const parseClassInput = (text) => {
      const regex = /,\s*(?![^()]*\))/g;
      const tokens = text.split(regex).map(s => s.trim()).filter(Boolean);
      const expanded = [];
      tokens.forEach(token => {
        const match = token.match(/^(.*?)\((.*?)\)(-\[.*?\])?$/);
        if (match) {
          const base = match[1].trim();
          const partsStr = match[2];
          const grade = match[3] ? match[3].trim() : '';
          const parts = partsStr.split(',').map(p => p.trim()).filter(Boolean);
          parts.forEach(p => expanded.push(`${base}(${p})${grade}`));
        } else {
          expanded.push(token);
        }
      });
      return expanded;
    };

    const ALL_DAYS = ['Sat','Sun','Mon','Tue','Wed','Thu','Fri'];
    const DEFAULT_QUESTION_TYPES = ["MCQ","Structured","Essay","True/False","Match","One Word","Fill the Blanks"];

    // ══════════════════════════════════════════
    //  GOOGLE DRIVE INTEGRATION LOGIC
    // ══════════════════════════════════════════
    const useGoogleDrive = () => {
      const [isSignedIn, setIsSignedIn] = useState(false);
      const [accessToken, setAccessToken] = useState(null);
      const [fileId, setFileId] = useState(null);           // ID of the stored JSON
      const [gapiReady, setGapiReady] = useState(false);

      // Initialise gapi client
      useEffect(() => {
        const initGapi = () => {
          window.gapi.load('client', async () => {
            await window.gapi.client.init({});
            setGapiReady(true);
          });
        };
        if (window.gapi) initGapi();
        else window.addEventListener('load', initGapi, { once: true });
        // Also try again after async scripts
        const timer = setInterval(() => {
          if (window.gapi && !gapiReady) initGapi();
        }, 500);
        return () => clearInterval(timer);
      }, []);

      // Check for existing token in sessionStorage
      useEffect(() => {
        const stored = sessionStorage.getItem('driveAccessToken');
        if (stored) {
          setAccessToken(stored);
          setIsSignedIn(true);
          window.gapi.auth.setToken({ access_token: stored });
        }
      }, []);

      // Trigger OAuth flow
      const signIn = useCallback(() => {
        const client = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: SCOPES,
          callback: (tokenResponse) => {
            if (tokenResponse?.access_token) {
              setAccessToken(tokenResponse.access_token);
              sessionStorage.setItem('driveAccessToken', tokenResponse.access_token);
              window.gapi.auth.setToken({ access_token: tokenResponse.access_token });
              setIsSignedIn(true);
              // Look for existing file
              findFile(tokenResponse.access_token);
            }
          },
        });
        client.requestAccessToken();
      }, []);

      const signOut = useCallback(() => {
        sessionStorage.removeItem('driveAccessToken');
        setAccessToken(null);
        setIsSignedIn(false);
        setFileId(null);
        window.gapi.auth.setToken(null);
        // Revoke token if possible (optional)
        try {
          google.accounts.oauth2.revoke(accessToken);
        } catch(e) {}
      }, [accessToken]);

      // Find the app's data file
      const findFile = async (token) => {
        let loadedFileId = fileId;
        if (!gapiReady) return;
        try {
          const res = await window.gapi.client.drive.files.list({
            q: `name = '${DATA_FILENAME}' and trashed = false`,
            spaces: 'appDataFolder',           // ← search hidden folder
            fields: 'files(id, name)',
            access_token: token,
          });
          if (res.result.files.length > 0) {
            loadedFileId = res.result.files[0].id;
          }
        } catch (err) {
          console.warn('Drive file search failed:', err);
        }
        setFileId(loadedFileId);  // important: store the found ID
        return loadedFileId;
      };

      // Read data from Drive
     const loadFromDrive = async (token = accessToken) => {
        if (!gapiReady || !token) return null;
        try {
          const listRes = await window.gapi.client.drive.files.list({
            q: `name = '${DATA_FILENAME}' and trashed = false`,
            spaces: 'appDataFolder',           // ← fix here too
            fields: 'files(id)',
            access_token: token,
          });
          const files = listRes.result.files;
          if (!files || files.length === 0) return null;
          const id = files[0].id;
          setFileId(id);
          const getRes = await window.gapi.client.drive.files.get({
            fileId: id,
            alt: 'media',
            access_token: token,
          });
          return JSON.parse(getRes.body);
        } catch (err) {
          if (err?.result?.error?.code === 401) signOut();
          console.error('Drive load error:', err);
          return null;
        }
      };
      
      // Save data to Drive
      const saveToDrive = async (data, token = accessToken, existingFileId = fileId) => {
        if (!gapiReady || !token) return false;
        try {
          const metadata = {
            name: DATA_FILENAME,
            mimeType: 'application/json',
          };
          const media = {
            mimeType: 'application/json',
            body: JSON.stringify(data, null, 2),
          };

          if (existingFileId) {
            // Update existing file
            await window.gapi.client.drive.files.update({
              fileId: existingFileId,
              uploadType: 'media',
              media: media,
              access_token: token,
            });
            return existingFileId;
          } else {
            // Create new file in AppDataFolder (hidden from normal view)
            const createRes = await window.gapi.client.drive.files.create({
              resource: { ...metadata, parents: ['appDataFolder'] },
              media: media,
              fields: 'id',
              access_token: token,
            });
            const newId = createRes.result.id;
            setFileId(newId);
            return newId;
          }
        } catch (err) {
          if (err?.result?.error?.code === 401) signOut();
          console.error('Drive save error:', err);
          return false;
        }
      };

      return {
        isSignedIn,
        gapiReady,
        signIn,
        signOut,
        loadFromDrive,
        saveToDrive,
        fileId,
      };
    };

    // --- NAVIGATION ---
    const NavigationMenu = ({ navOpen, setNavOpen, currentView, setCurrentView, driveStatus }) => {
      const navItems = [
        { id: 'home', icon: 'fa-solid fa-bell', label: 'Reminders' },
        { id: 'timetable', icon: 'fa-solid fa-calendar', label: 'Timetable' },
        { id: 'lessons', icon: 'fa-solid fa-book-open', label: 'Lesson Log' },
        { id: 'exams', icon: 'fa-solid fa-file-alt', label: 'Exams' },
        { id: 'marks', icon: 'fa-solid fa-clipboard-list', label: 'Marks' },
        { id: 'settings', icon: 'fa-solid fa-cog', label: 'Settings' },
      ];
      return (
        <div className="fixed top-4 left-4 z-50">
          <button onClick={() => setNavOpen(!navOpen)} className={`w-12 h-12 md:w-14 md:h-14 bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-lg transition-transform duration-300 ${navOpen ? 'rotate-90' : ''} relative z-10`}>
            <i className={navOpen ? 'fa-solid fa-times' : 'fa-solid fa-bars'} style={{fontSize: '24px'}}></i>
          </button>
          {navItems.map((item, index) => {
            const y = navOpen ? 60 + (index * 50) : 0;
            return (
              <button
                key={item.id}
                onClick={() => { setCurrentView(item.id); setNavOpen(false); }}
                className={`absolute top-2 left-2 w-10 h-10 md:w-12 md:h-12 bg-white text-indigo-700 rounded-full flex items-center justify-center shadow-md transition-all duration-300 ${currentView === item.id ? 'ring-2 ring-indigo-500 bg-indigo-50' : ''}`}
                style={{ transform: `translate(0px, ${y}px) scale(${navOpen ? 1 : 0})`, opacity: navOpen ? 1 : 0, pointerEvents: navOpen ? 'auto' : 'none', transitionDelay: `${index * 30}ms` }}
                title={item.label}
              >
                <i className={item.icon} style={{fontSize: '18px'}}></i>
              </button>
            );
          })}
        </div>
      );
    };

    // --- Quick Add Marks Modal ---
    const QuickAddMarksModal = ({ subject, date, data, updateData, onClose }) => {
      const defaultActivityName = date ? date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) : '';
      const [activityName, setActivityName] = useState(defaultActivityName);
      const [bulkText, setBulkText] = useState("");
      const [statusMsg, setStatusMsg] = useState("");

      const handleSave = () => {
        if (!activityName.trim()) {
          setStatusMsg("Enter an activity name.");
          setTimeout(() => setStatusMsg(""), 3000);
          return;
        }
        const lines = bulkText.split('\n');
        const results = [];
        lines.forEach(line => {
          const parts = line.trim().split(/\s+/);
          if (parts.length >= 2) {
            const index = parts[0];
            const marks = parts.slice(1).join(' ');
            results.push({ index, marks });
          }
        });
        if (results.length === 0) {
          setStatusMsg("No valid marks. Format: Index SPACE Marks.");
          setTimeout(() => setStatusMsg(""), 3000);
          return;
        }
        const currentMarks = { ...data.marks };
        if (!currentMarks[subject]) currentMarks[subject] = {};
        currentMarks[subject][activityName] = results;
        updateData('marks', currentMarks);
        setStatusMsg("Marks saved!");
        setTimeout(() => {
          setStatusMsg("");
          onClose();
        }, 1000);
      };

      return (
        <React.Fragment>
          <h3 className="text-2xl font-bold mb-4 text-gray-800 flex items-center">
            <i className="fa-solid fa-clipboard-list text-indigo-600 mr-2"></i> Add Marks
          </h3>
          <p className="text-sm text-gray-600 mb-2">
            Subject: <strong>{subject}</strong>
          </p>
          <div className="mb-4">
            <label className="block text-sm font-bold text-gray-700 mb-1">Activity Name</label>
            <input 
              type="text" 
              className="w-full p-2 border border-gray-300 rounded-lg bg-white font-bold text-gray-800" 
              value={activityName} 
              onChange={e => setActivityName(e.target.value)} 
              placeholder="e.g. Assignment 1, Test, etc."
            />
          </div>
          <div className="mb-4">
            <label className="block text-sm font-bold text-gray-700 mb-1">Marks (Bulk Paste)</label>
            <textarea 
              className="w-full p-4 border border-gray-300 rounded-xl mb-2 focus:ring-2 focus:ring-indigo-500 font-mono text-sm h-32" 
              placeholder="1001 85&#10;1002 92&#10;1003 ab" 
              value={bulkText} 
              onChange={e => setBulkText(e.target.value)}
            ></textarea>
            <p className="text-xs text-gray-500">Format: Index [space] Marks per line</p>
          </div>
          {statusMsg && (
            <p className="text-sm font-bold text-indigo-600 bg-indigo-50 p-2 rounded-lg mb-4 text-center">{statusMsg}</p>
          )}
          <div className="flex justify-end space-x-2 border-t border-gray-100 pt-4">
            <button onClick={onClose} className="px-4 py-2 text-gray-600 font-bold hover:bg-gray-100 rounded-lg transition">Cancel</button>
            <button onClick={handleSave} className="px-5 py-2 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 shadow-sm transition">Save Marks</button>
          </div>
        </React.Fragment>
      );
    };

    // --- HOME VIEW ---
    const HomeView = ({ data, updateData, selectedDate, setSelectedDate, setModal, setCurrentView }) => {
      const [currentTime, setCurrentTime] = useState(new Date());
      const [newReminderText, setNewReminderText] = useState("");
      const [newReminderDate, setNewReminderDate] = useState("");
      const [newReminderRepeat, setNewReminderRepeat] = useState("none");

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const termStart = data.timetableConfig?.termStart || null;
      const firstWeekType = data.timetableConfig?.firstWeekType || 'A';
      const currentWeekNum = getWeekNumber(selectedDate, termStart, firstWeekType);
      let currentWeekType = 'A';
      if (termStart) {
        const startWeekNum = getWeekNumber(new Date(termStart + 'T00:00:00'), termStart, firstWeekType);
        const diff = currentWeekNum - startWeekNum;
        const isB = firstWeekType === 'A' ? diff % 2 !== 0 : diff % 2 === 0;
        currentWeekType = isB ? 'B' : 'A';
      } else {
        currentWeekType = currentWeekNum % 2 !== 0 ? 'A' : 'B';
      }

      const todayDayStr = getDayString(selectedDate);
      const todayClasses = data.timetableConfig.periods.map(p => {
        const slot = data.timetableSlots[`${todayDayStr}-${p.id}`];
        let subject = null;
        if (slot && !p.isBreak) {
          subject = (currentWeekType === 'B' && slot.companion) ? slot.companion : slot.primary;
        }
        return { ...p, subject };
      }).filter(p => p.subject);

      const isToday = selectedDate.toDateString() === new Date().toDateString();

      let activePeriod = null, activeSubject = null;
      if (isToday) {
        const currentDayStr = getDayString(currentTime);
        const currentTimeStr = currentTime.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
        if (data.timetableConfig.days.includes(currentDayStr)) {
          activePeriod = data.timetableConfig.periods.find(p => currentTimeStr >= p.start && currentTimeStr < p.end);
          if (activePeriod && !activePeriod.isBreak) {
            const slot = data.timetableSlots[`${currentDayStr}-${activePeriod.id}`];
            if (slot) {
              activeSubject = (currentWeekType === 'B' && slot.companion) ? slot.companion : slot.primary;
            }
          }
        }
      }

      const addReminder = () => {
        if (!newReminderText.trim()) return;
        const newRems = [...data.reminders, {
          id: Date.now(), text: newReminderText, targetDate: newReminderDate, repeat: newReminderRepeat, done: false
        }];
        updateData('reminders', newRems);
        setNewReminderText(""); setNewReminderDate(""); setNewReminderRepeat("none");
      };

      const activeReminders = data.reminders.filter(r => {
        if (!r.targetDate) return true;
        const rDate = new Date(r.targetDate); rDate.setHours(0,0,0,0);
        const sDate = new Date(selectedDate); sDate.setHours(0,0,0,0);
        if (r.repeat === 'none') return rDate.getTime() === sDate.getTime();
        if (sDate < rDate) return false;
        if (r.repeat === 'daily') return true;
        if (r.repeat === 'weekly') return rDate.getDay() === sDate.getDay();
        if (r.repeat === 'monthly') return rDate.getDate() === sDate.getDate();
        return false;
      });

      const allRemindersDone = activeReminders.length > 0 && activeReminders.every(r => r.done);

      return (
        <div className="space-y-6 max-w-4xl mx-auto">
          <div className="flex flex-col sm:flex-row items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3 sm:space-y-0">
            <div className="flex items-center">
              <button onClick={() => { const d = new Date(selectedDate); d.setDate(d.getDate()-1); setSelectedDate(d); }} className="p-2 hover:bg-gray-100 rounded-full"><i className="fa-solid fa-chevron-left"></i></button>
              <div className="text-center px-4">
                <h2 className="text-xl font-bold text-gray-800 cursor-pointer" onClick={() => document.getElementById('jumpDate')?.showPicker?.()}>
                  {formatDate(selectedDate)}
                </h2>
                <input id="jumpDate" type="date" className="sr-only" value={selectedDate.toISOString().slice(0,10)} onChange={e => setSelectedDate(new Date(e.target.value + 'T00:00:00'))} />
                <button onClick={() => setSelectedDate(new Date())} className="text-indigo-600 text-sm font-semibold hover:underline mt-1">Jump to Today</button>
              </div>
              <button onClick={() => { const d = new Date(selectedDate); d.setDate(d.getDate()+1); setSelectedDate(d); }} className="p-2 hover:bg-gray-100 rounded-full"><i className="fa-solid fa-chevron-right"></i></button>
            </div>
            <div className="flex flex-wrap justify-center gap-2 items-center">
              <div className="px-3 py-1.5 bg-indigo-50 text-indigo-700 rounded-lg border border-indigo-100 font-bold text-sm flex items-center shadow-sm whitespace-nowrap">
                <i className="fa-solid fa-graduation-cap mr-2"></i> Term {data.activeTerm}
              </div>
              <div className="flex bg-gray-100 rounded-lg p-1 border border-gray-200 items-center space-x-1 shadow-sm">
                <div className="px-4 py-1.5 text-sm font-bold rounded-md bg-indigo-600 text-white shadow" title={`Week Number: ${currentWeekNum}`}>Week {currentWeekType}</div>
                <div className="w-px h-6 bg-gray-300 mx-1"></div>
                <button onClick={() => setModal({isOpen: true, type: 'ADVANCED_LEAVE', payload: { classes: todayClasses }})} className="px-3 py-1.5 text-sm font-bold rounded-md bg-red-100 text-red-600 hover:bg-red-200 transition" title="Log Leave / Event">
                  <i className="fa-solid fa-bed"></i>
                </button>
              </div>
            </div>
          </div>

          {/* Reminders section */}
          <div className={`bg-orange-50 border-l-4 border-orange-400 p-4 rounded-r-lg shadow-sm ${allRemindersDone ? 'opacity-70' : ''}`}>
            <div className="flex justify-between items-center mb-3">
              <h3 className="text-lg font-bold text-orange-800 flex items-center">
                <i className="fa-solid fa-bell mr-2"></i> Reminders for {formatDate(selectedDate)}
              </h3>
              <div className="flex items-center gap-2">
                {allRemindersDone && <span className="text-xs font-bold text-green-600 bg-green-100 px-2 py-1 rounded">All Done!</span>}
                <button onClick={() => setModal({isOpen: true, type: 'MANAGE_REMINDERS'})} className="text-xs font-bold text-orange-700 bg-white border border-orange-300 px-2 py-1 rounded hover:bg-orange-100 transition">
                  <i className="fa-solid fa-list-check mr-1"></i> Manage
                </button>
              </div>
            </div>
            <div className="space-y-3 max-h-48 overflow-y-auto mb-3 pr-2">
              {activeReminders.map(r => (
                <div key={r.id} className="flex items-start space-x-3 cursor-pointer group"
                     onClick={() => {
                       const newRems = data.reminders.map(rem => rem.id === r.id ? {...rem, done: !rem.done} : rem);
                       updateData('reminders', newRems);
                     }}>
                  <i className={`${r.done ? 'fa-solid fa-check-circle text-green-500 mt-1' : 'fa-regular fa-circle text-gray-400 group-hover:text-indigo-400 mt-1'} shrink-0`} style={{fontSize: '20px'}}></i>
                  <div className={`flex-1 ${r.done ? 'opacity-50 line-through' : ''}`}>
                    <span className="text-gray-800 block">{r.text}</span>
                    <div className="flex space-x-2 text-xs font-bold mt-0.5">
                      {r.repeat !== 'none' && <span className="text-blue-500 bg-blue-100 px-1.5 rounded uppercase">{r.repeat}</span>}
                      {r.targetDate && <span className="text-orange-500"><i className="fa-regular fa-calendar mr-1"></i>Starts: {r.targetDate}</span>}
                    </div>
                  </div>
                  <button onClick={(e) => { e.stopPropagation(); updateData('reminders', data.reminders.filter(rem => rem.id !== r.id)); }}
                    className="text-red-400 opacity-0 group-hover:opacity-100 hover:text-red-600 transition p-1">
                    <i className="fa-solid fa-trash"></i>
                  </button>
                </div>
              ))}
              {activeReminders.length === 0 && <p className="text-sm text-gray-500 italic">No reminders for this date.</p>}
            </div>
            <div className="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-2 pt-2 border-t border-orange-200">
              <input type="text" value={newReminderText} onChange={e => setNewReminderText(e.target.value)}
                     onKeyDown={e => e.key === 'Enter' && addReminder()} placeholder="Add a new reminder..."
                     className="flex-1 text-sm p-2 border border-orange-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 bg-white" />
              <input type="date" value={newReminderDate} onChange={e => setNewReminderDate(e.target.value)}
                     className="text-sm p-2 border border-orange-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 bg-white w-full sm:w-auto" title="Target Date" />
              <select value={newReminderRepeat} onChange={e => setNewReminderRepeat(e.target.value)}
                      className="text-sm p-2 border border-orange-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 bg-white w-full sm:w-auto" title="Repeat Mode">
                <option value="none">No Repeat</option>
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
              </select>
              <button onClick={addReminder} className="bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm hover:bg-orange-600 transition flex items-center justify-center">
                <i className="fa-solid fa-plus mr-1"></i> Add
              </button>
            </div>
          </div>

          {/* Live Status / Today's Schedule */}
          <div className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
            <div className="absolute top-0 right-0 p-4 opacity-20">
              <i className="fa-solid fa-calendar" style={{fontSize: '100px'}}></i>
            </div>
            <h2 className="text-sm font-semibold uppercase tracking-wider mb-1 opacity-90">

                        <div className="w-full hidden md:block">
                          <div className="flex justify-between text-xs text-gray-500 mb-1">
                            <span>Progress</span>
                            <span>{data.lessons[cls.subject].currentPages}/{getTotalPages(data, cls.subject)} pg</span>
                          </div>
                          <div className="w-full bg-gray-200 rounded-full h-1.5">

    // --- TIMETABLE VIEW ---
    const TimetableView = ({ data, updateData }) => {

              <tbody>
                {data.timetableConfig.periods.map(period => (
                  <tr key={period.id} className="border-b border-gray-100 hover:bg-gray-50 transition-colors">

                      <div className="text-xs text-gray-500">{period.start} - {period.end}</div>
                    </td>

                            onChange={(e) => {
                              const newSlots = {...data.timetableSlots};

                            }}>

                            {data.classes.map(c => <option key={`p-${c}`} value={c}>{c}</option>)}

                              {slot.companion !== '' || slot.showCompanion ? (
                                <div className="relative">
                                  <span className="text-[10px] uppercase font-bold text-orange-500 block mb-1">Week B (Companion)</span>
                                  <select className="w-full p-1.5 text-xs border border-orange-200 bg-orange-50 rounded-lg focus:ring-1 focus:ring-orange-400 focus:outline-none"
                                    value={slot.companion}
                                    onChange={(e) => {
                                      const newSlots = {...data.timetableSlots};
                                      newSlots[slotKey] = { ...slot, companion: e.target.value };
                                      updateData('timetableSlots', newSlots);
                                    }}>
                                    <option value="">-- Select Companion --</option>
                                    {data.classes.map(c => <option key={`c-${c}`} value={c}>{c}</option>)}
                                  </select>
                                  <button onClick={() => {
                                      const newSlots = {...data.timetableSlots};
                                      newSlots[slotKey] = { ...slot, companion: '', showCompanion: false };
                                      updateData('timetableSlots', newSlots);
                                  }} className="absolute top-0 right-0 text-red-400 hover:text-red-600 text-xs p-1"><i className="fa-solid fa-times"></i></button>
                                </div>

                                  updateData('timetableSlots', newSlots);
                                }} className="text-[11px] font-bold text-orange-600 hover:text-orange-800 bg-orange-100 px-2 py-1 rounded w-full">+ Add Week B Subject</button>

    // --- LESSON CARD ---
    const LessonCard = ({ subject, partName, data, updateData, setModal }) => {
      const log = data.lessons[subject] || { currentPages: 0, attended: 0, leaves: 0, late: 0, meetings: 0 };
      const totalPg = getTotalPages(data, subject);
      const progress = (log.currentPages / totalPg) * 100 || 0;
      const totalPeriods = log.attended + log.leaves || 1;
      const maxTerms = data.classTerms[subject] || 3;
      const termWarning = data.activeTerm > maxTerms;
      const title = partName ? partName : subject;

      return (
        <div className={`bg-white p-5 rounded-2xl shadow-sm border ${termWarning ? 'border-red-300' : 'border-gray-100'} relative h-full flex flex-col`}>
          {termWarning && (
            <div className="absolute top-0 right-0 bg-red-100 text-red-600 text-[10px] font-bold px-2 py-1 rounded-bl-lg rounded-tr-2xl flex items-center">
              <i className="fa-solid fa-exclamation-triangle mr-1"></i> Max {maxTerms} terms
            </div>
          )}
          <div className="flex justify-between items-start mb-4 mt-2">
            <h3 className="font-bold text-lg text-gray-800 flex items-center">
              {title}
              {partName && <span className="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded ml-2 font-bold uppercase hidden sm:block">Part</span>}
            </h3>
            <div className="flex-1"></div>
            <div className="flex flex-wrap gap-2 justify-end">
              <button onClick={() => setModal({ isOpen: true, type: 'LOG_PAGES', payload: { subject } })} className="text-green-600 px-2 py-1 hover:bg-green-50 rounded text-xs font-bold border border-green-200 transition">Log Pages</button>
              <button onClick={() => setModal({ isOpen: true, type: 'LOG_EXCEPTION', payload: { subject } })} className="text-red-500 px-2 py-1 hover:bg-red-50 rounded text-xs font-bold border border-red-200 transition">Exception</button>
              <button onClick={() => setModal({ isOpen: true, type: 'EDIT_SYLLABUS', payload: { subject } })} className="text-indigo-600 px-2 py-1 hover:bg-indigo-50 rounded text-xs font-bold border border-indigo-200 transition">Syllabus</button>
            </div>
          </div>
          
          <div className="space-y-4 flex-1 flex flex-col justify-end">
            <div>
              <div className="flex justify-between text-sm text-gray-600 mb-1">
                <span>Pages (Taught / Total)</span>
                <span className="font-mono">{log.currentPages} / {totalPg}</span>
              </div>
              <div className="w-full bg-gray-200 rounded-full h-2 mb-2">
                <div className="bg-indigo-500 h-2 rounded-full transition-all duration-500" style={{ width: `${Math.min(progress, 100)}%` }}></div>
              </div>
              <div className="flex justify-end">
                <span className="font-bold text-[11px] text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md border border-indigo-100 shadow-sm">
                  <i className="fa-solid fa-chart-line mr-1"></i> Pace: {log.attended > 0 ? (log.currentPages / log.attended).toFixed(1) : 0} pg/lsn
                </span>
              </div>
            </div>
            <div className="flex space-x-2 text-sm mt-2">
               <div className="flex-1 bg-green-50 text-green-700 p-2 rounded-lg text-center border border-green-100"><span className="block font-bold text-lg">{Math.round((log.attended/totalPeriods)*100) || 0}%</span><span className="text-[10px] uppercase">Attended</span></div>
               <div className="flex-1 bg-red-50 text-red-700 p-2 rounded-lg text-center border border-red-100"><span className="block font-bold text-lg">{Math.round((log.leaves/totalPeriods)*100) || 0}%</span><span className="text-[10px] uppercase">Leave</span></div>
               <div className="flex-1 bg-orange-50 text-orange-700 p-2 rounded-lg text-center border border-orange-100" title="Classes Late"><span className="block font-bold text-lg">{log.late || 0}</span><span className="text-[10px] uppercase">Late</span></div>
               <div className="flex-1 bg-blue-50 text-blue-700 p-2 rounded-lg text-center border border-blue-100" title="Missed due to Meetings"><span className="block font-bold text-lg">{log.meetings || 0}</span><span className="text-[10px] uppercase">Events</span></div>
            </div>
          </div>
        </div>
      );
    };

    // --- LESSONS VIEW ---
    const LessonsView = ({ data, updateData, setModal }) => {
      const activeSubjects = data.classes || [];
      const [filterSubject, setFilterSubject] = useState('All');
      const groupedClasses = useMemo(() => {
        const groups = {};
        activeSubjects.forEach(subject => {
          const match = subject.match(/^(.*?)\((.*?)\)(-\[.*?\])?$/);
          if (match) {
            const base = match[1].trim();
            const part = match[2].trim();
            const grade = match[3] ? match[3].trim() : '';
            const groupKey = `${base}${grade}`;
            if (!groups[groupKey]) groups[groupKey] = { type: 'group', title: groupKey, items: [] };
            groups[groupKey].items.push({ subject, part });
          } else {
            if (!groups[subject]) groups[subject] = { type: 'single', title: subject, items: [] };
            groups[subject].items.push({ subject, part: null });
          }
        });
        return Object.values(groups);
      }, [activeSubjects]);

      const displayGroups = filterSubject === 'All' ? groupedClasses : groupedClasses.filter(g => g.title === filterSubject);

      return (
        <div className="space-y-6 max-w-4xl mx-auto">
          <div className="flex flex-col sm:flex-row sm:justify-between items-start sm:items-center space-y-3 sm:space-y-0 border-b pb-4">
            <h2 className="text-2xl font-bold text-gray-800 flex items-center"><i className="fa-solid fa-book-open mr-2 text-indigo-600"></i> Lesson Progress</h2>
            <div className="flex flex-wrap items-center gap-3">
              <div className="flex items-center space-x-2">
                <span className="text-sm font-bold text-gray-500">Filter Subject:</span>
                <select className="p-1.5 border border-gray-300 rounded-lg bg-white shadow-sm font-bold text-gray-700" value={filterSubject} onChange={e => setFilterSubject(e.target.value)}>
                  <option value="All">All Subjects</option>
                  {groupedClasses.map(g => <option key={g.title} value={g.title}>{g.title}</option>)}
                </select>
              </div>
              <div className="w-px h-6 bg-gray-300 hidden sm:block"></div>
              <div className="flex items-center space-x-2">
                <span className="text-sm font-bold text-gray-500">Term:</span>
                <select className="p-1.5 border border-gray-300 rounded-lg bg-indigo-50 shadow-sm font-bold text-indigo-700" value={data.activeTerm} onChange={e => updateData('activeTerm', parseInt(e.target.value))}>
                  <option value={1}>Term 1</option><option value={2}>Term 2</option><option value={3}>Term 3</option><option value={4}>Term 4</option>
                </select>
              </div>
            </div>
          </div>
          <div className="grid md:grid-cols-2 gap-4">
            {activeSubjects.length === 0 && <div className="col-span-2 text-center p-8 bg-gray-50 rounded-xl border border-gray-200 text-gray-500">No classes configured. Go to Settings to add your classes.</div>}

               if (group.type === 'single') {
                  const item = group.items[0];
                  return <div key={item.subject} className="col-span-1"><LessonCard subject={item.subject} partName={null} data={data} updateData={updateData} setModal={setModal} /></div>;
               } else {
                  return (
                     <div key={group.title + idx} className="col-span-1 md:col-span-2 bg-indigo-50/50 p-5 rounded-3xl border border-indigo-100 mb-2 shadow-inner">
                        <h3 className="text-xl font-bold text-indigo-900 mb-4 px-2 flex items-center"><i className="fa-solid fa-layer-group mr-3 text-indigo-500"></i> {group.title} (Parts)</h3>
                        <div className="grid md:grid-cols-2 gap-4">
                           {group.items.map(item => <LessonCard key={item.subject} subject={item.subject} partName={item.part} data={data} updateData={updateData} setModal={setModal} />)}

                     </div>
